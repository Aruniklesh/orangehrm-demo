# Non-secret settings. Safe to commit.
# Credentials are NOT stored here: they are read from the environment variables
# ORANGEHRM_USERNAME and ORANGEHRM_PASSWORD (see README).

base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# Supported values: chrome, edge
browser=chrome

# true = run the browser without a window (needed on CI servers such as Jenkins).
# Can be overridden from the command line: mvn test -Dheadless=true
headless=false

# Maximum seconds an explicit wait will wait for an element
explicit.wait.seconds=15
